name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: aspireasbemulatorui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read project Version
        id: read_version
        shell: pwsh
        run: |
          $csproj = 'src/AspireAsbEmulatorUi.Hosting/AspireAsbEmulatorUi.Hosting.csproj'         
          Write-Host "Checking project file path: $csproj"
          if (-not (Test-Path $csproj)) {
            Write-Host "Project file not found: $csproj"
            Write-Host "Listing src folder (first 50):" ; Get-ChildItem -Path src -Recurse -Depth 2 | Select-Object -First 50 | ForEach-Object { Write-Host $_.FullName }
            echo "image_version=0.0.0" >> $env:GITHUB_OUTPUT
            echo "image_tag=0.0.0" >> $env:GITHUB_OUTPUT
            echo "image_tag_with_sha=0.0.0-unknown" >> $env:GITHUB_OUTPUT
            exit 0
          }          
          $content = Get-Content $csproj -Raw
          $version = '0.0.0'
          if ($content -match '<Version>(.*?)</Version>') {
            $version = $matches[1].Trim()
            Write-Host "Extracted version: $version"
          } else {
            Write-Host "No <Version> element matched in file"
          }
          $shortsha = '${{ github.sha }}'
          if ($shortsha.Length -ge 7) { $shortsha = $shortsha.Substring(0,7) }
          else { $shortsha = 'unknown' }
          $image_tag = $version
          $image_tag_with_sha = "$version-$shortsha"
          echo "image_version=$version" >> $env:GITHUB_OUTPUT
          echo "image_tag=$image_tag" >> $env:GITHUB_OUTPUT
          echo "image_tag_with_sha=$image_tag_with_sha" >> $env:GITHUB_OUTPUT

      - name: Print read_version outputs
        run: |
          echo "read_version.image_tag='${{ steps.read_version.outputs.image_tag }}'"
          echo "read_version.image_tag_with_sha='${{ steps.read_version.outputs.image_tag_with_sha }}'"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          # Use the `src` folder as the build context so project references
          # (for example AspireAsbEmulatorUi.Hosting) are available during restore/build
          context: ./src
          file: ./src/AspireAsbEmulatorUi.App/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.read_version.outputs.image_tag }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.read_version.outputs.image_tag_with_sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Set canonical image_ref
        id: set_image_ref
        run: |
          echo "image_ref=${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.docker_build.outputs.digest }}" >> $GITHUB_OUTPUT

