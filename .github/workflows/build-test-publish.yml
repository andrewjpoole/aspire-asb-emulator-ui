name: Build and Test

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test tests/AspireAsbEmulatorUi.Hosting.Tests/AspireAsbEmulatorUi.Hosting.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: TestResults/

    - name: Pack NuGet package
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      run: dotnet pack src/AspireAsbEmulatorUi.Hosting/AspireAsbEmulatorUi.Hosting.csproj --configuration Release --no-build --output ./artifacts

    - name: Publish to NuGet
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload NuGet packages
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
